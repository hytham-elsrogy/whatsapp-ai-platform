worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Don't advertise the exact nginx version in error pages/headers.
    server_tokens off;

    gzip           on;
    gzip_vary      on;
    gzip_types     text/plain text/css application/json application/javascript
                   text/xml application/xml application/xml+rss text/javascript;

    # Matches the app's own PDF upload limit (knowledge-base.controller.ts,
    # MAX_PDF_BYTES = 20MB) with a little headroom — nginx's 1MB default
    # would otherwise reject those uploads before they ever reach backend.
    client_max_body_size 25m;

    # Defense in depth in front of the app-level login throttle
    # (auth.controller.ts, 5/min) — rejects excess requests at the edge,
    # before they cost a Node event-loop turn. burst=10 absorbs a page's
    # worth of legitimate retries/typos without tripping nodelay rejection.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

    upstream frontend_upstream {
        server frontend:3001;
    }

    upstream backend_upstream {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO — this app's client only uses the websocket transport
        # (no polling fallback), so the Upgrade/Connection headers here are
        # load-bearing, not just best practice.
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Self-signed — fine for local TLS-termination verification, but a
        # real deployment needs a real cert (Let's Encrypt/managed), which
        # needs a real public domain this dev environment doesn't have. See
        # 09-deployment-architecture.md §4.
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
