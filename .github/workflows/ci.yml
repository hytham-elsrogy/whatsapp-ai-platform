name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # NEXT_PUBLIC_API_URL is intentionally empty — see docker-compose.yml's
      # frontend.build.args comment; a relative URL is what the app actually
      # ships with, and CI's build should match production, not local dev's
      # absolute-URL .env.local.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

# No test job: this project has no automated test suite (.spec.ts/.test.ts)
# in either app — every phase and hardening round was verified live instead
# (real API calls, real browser automation, real infra). That's a deliberate,
# consistently-applied choice documented throughout this project's history,
# not an oversight. If that ever changes, add a `npm test` step per job.
